<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Doc-V Gateway{% endblock %}</title>
<style>{{ ds_css }}</style>
</head>
<body>
<header class="gw-header">
  <div class="left">
    <a class="wordmark" href="/ui"><span aria-hidden="true">◢</span>DOC-V GATEWAY</a>
    <nav class="gw-nav">
      <a href="/ui" class="{{ 'active' if page == 'dash' }}">Обзор</a>
      <a href="/ui/jobs" class="{{ 'active' if page == 'jobs' }}">Задания</a>
      <a href="/ui/ops" class="{{ 'active' if page == 'ops' }}">Операции</a>
      <a href="/ui/files" class="{{ 'active' if page == 'files' }}">Файлы</a>
      <a href="/ui/signers" class="{{ 'active' if page == 'signers' }}">Подписанты</a>
      <a href="/ui/typst" class="{{ 'active' if page == 'typst' }}">Шаблоны</a>
      <a href="/ui/render" class="{{ 'active' if page == 'render' }}">Рендер</a>
      <a href="/ui/api" class="{{ 'active' if page == 'api' }}">API</a>
      <a href="/ui/settings" class="{{ 'active' if page == 'settings' }}">Настройки</a>
    </nav>
  </div>
  <div class="right">
    {% if refreshable %}
    <label class="online" style="margin:0;cursor:pointer;font-weight:500">
      <input type="checkbox" id="autorefresh" style="width:auto;height:auto;box-shadow:none">
      обновлять
    </label>
    {% endif %}
    <span class="online"><span class="dot sm live"></span>онлайн</span>
    <span class="user-chip">Администратор</span>
    <a href="/ui/logout" class="muted" style="font-size:12px">Выйти</a>
  </div>
</header>
<main>
{% if flash %}<div class="flash {{ 'err' if flash_err }}">{{ flash }}</div>{% endif %}
{% block content %}{% endblock %}
</main>

<script>
// Долгие действия: кнопка блокируется и объясняет, что происходит,
// иначе форму жмут второй раз и получают два реестра.
document.addEventListener('submit', function (e) {
  const form = e.target;
  if (form.dataset.noLock) return;
  const btn = form.querySelector('button:not([type=button])');
  if (!btn || btn.dataset.locked) return;
  setTimeout(function () {
    btn.dataset.locked = '1';
    btn.dataset.label = btn.textContent;
    btn.textContent = btn.dataset.busy || 'Выполняется…';
    btn.disabled = true;
  }, 0);
});

// Копирование значений: ссылки на файлы, curl-строки, токены.
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-copy]');
  if (!el) return;
  e.preventDefault();
  navigator.clipboard.writeText(el.dataset.copy).then(function () {
    const was = el.textContent;
    el.textContent = 'скопировано';
    setTimeout(function () { el.textContent = was; }, 1200);
  });
});

// Выбрать все строки таблицы (файлы).
document.addEventListener('change', function (e) {
  if (e.target.id !== 'checkall') return;
  document.querySelectorAll('input[name=tokens]').forEach(function (x) {
    x.checked = e.target.checked;
  });
});

// Ctrl/Cmd+Enter отправляет форму, в которой стоит курсор;
// Ctrl/Cmd+S сохраняет, не открывая диалог браузера.
document.addEventListener('keydown', function (e) {
  const meta = e.ctrlKey || e.metaKey;
  if (!meta) return;
  const form = e.target.form;
  if (e.key === 'Enter' && form) { e.preventDefault(); form.requestSubmit(); }
  if (e.key.toLowerCase() === 's') {
    const target = document.querySelector('form[data-hotkey-save]');
    if (target) { e.preventDefault(); target.requestSubmit(); }
  }
});

// Поиск внутри длинного списка выбора: сотрудников больше сотни, и
// листать их мышью невозможно. Прячем неподходящие пункты, а не
// перерисовываем список — так выбранное значение не теряется.
document.addEventListener('input', function (e) {
  const box = e.target.closest('[data-filter-for]');
  if (!box) return;
  const wrap = box.closest('.combo');
  const select = (wrap && wrap.querySelector('select'))
    || document.getElementById(box.dataset.filterFor);
  if (!select) return;
  const words = box.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0;
  select.querySelectorAll('option').forEach(function (o) {
    if (!o.value) { o.hidden = false; return; }   // «— не печатать —» всегда на месте
    const text = o.textContent.toLowerCase();
    const hit = words.every(function (w) { return text.indexOf(w) >= 0; });
    o.hidden = !hit;
    if (hit) shown++;
  });
  select.querySelectorAll('optgroup').forEach(function (g) {
    g.hidden = ![].some.call(g.querySelectorAll('option'), function (o) { return !o.hidden; });
  });
  const counter = box.parentNode.querySelector('[data-filter-count]');
  if (counter) counter.textContent = words.length ? shown + ' подходит' : '';
});

// Список подписей: строки добавляются, удаляются и переставляются на
// месте. Раньше каждая строка стоила перезагрузки страницы.
(function () {
  const table = document.getElementById('rowlist');
  if (!table) return;
  const tpl = document.getElementById('row-template');
  const body = table.querySelector('tbody');

  function renumber() {
    body.querySelectorAll('tr').forEach(function (tr, i) {
      const cell = tr.querySelector('[data-num]');
      if (cell) cell.textContent = i + 1;
    });
    const empty = document.getElementById('rowlist-empty');
    if (empty) empty.hidden = body.querySelectorAll('tr').length > 0;
  }

  document.addEventListener('click', function (e) {
    const add = e.target.closest('[data-add-row]');
    if (add) {
      e.preventDefault();
      body.appendChild(tpl.content.cloneNode(true));
      renumber();
      const last = body.lastElementChild;
      const filter = last && last.querySelector('[data-filter-for]');
      if (filter) filter.focus();
      return;
    }
    const drop = e.target.closest('[data-drop-row]');
    if (drop) {
      e.preventDefault();
      drop.closest('tr').remove();
      renumber();
      return;
    }
    const move = e.target.closest('[data-move-row]');
    if (move) {
      e.preventDefault();
      const tr = move.closest('tr');
      const up = move.dataset.moveRow === 'up';
      const other = up ? tr.previousElementSibling : tr.nextElementSibling;
      if (other) { up ? body.insertBefore(tr, other) : body.insertBefore(other, tr); }
      renumber();
    }
  });
  renumber();
})();

// Автообновление живых страниц — состояние переключателя запоминается.
(function () {
  const box = document.getElementById('autorefresh');
  if (!box) return;
  const KEY = 'gw_autorefresh';
  box.checked = localStorage.getItem(KEY) === '1';
  let timer = null;
  function apply() {
    if (timer) { clearInterval(timer); timer = null; }
    if (box.checked) timer = setInterval(function () { location.reload(); }, 15000);
  }
  box.addEventListener('change', function () {
    localStorage.setItem(KEY, box.checked ? '1' : '0');
    apply();
  });
  apply();
})();
</script>
</body>
</html>

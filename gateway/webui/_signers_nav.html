{% macro nav(tab) -%}
<div class="subnav">
  <a href="/ui/signers" class="{{ 'on' if tab == 'companies' }}">Компании</a>
  <a href="/ui/signers/sets" class="{{ 'on' if tab == 'sets' }}">Наборы согласующих</a>
  <a href="/ui/signers/roles" class="{{ 'on' if tab == 'roles' }}">Должности</a>
</div>
{%- endmacro %}

{% macro role_picker(field, roles, selected, empty='Не печатать') %}
<div class="combo">
  <input type="text" data-filter-for="{{ field }}" placeholder="Поиск">
  <select name="{{ field }}">
    <option value="">{{ empty }}</option>
    {% for r in roles %}
    <option value="{{ r.name }}" {{ 'selected' if r.name == selected }}>{{ r.holder }} ({{ r.title or 'Пусто' }})</option>
    {% endfor %}
  </select>
</div>
{%- endmacro %}
